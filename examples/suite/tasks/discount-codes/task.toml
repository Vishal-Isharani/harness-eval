id = "discount-codes"
repo = "../../../repos/shop"
timeout_s = 900
prompt = """
Marketing wants discount codes in the cart.

Add `Cart.apply_discount(code: str)` and `Cart.discount_cents()`:
- `SAVE10` gives 10% off the subtotal, rounded DOWN to whole cents.
- `FLAT500` gives 500 cents off.
- A discount can never make the subtotal negative.
- Only one code can be active; applying a new code replaces the previous one.
- Codes are case-insensitive.
- Unknown codes raise an `InvalidDiscountCode` error.
- Tax must be computed on the discounted subtotal, and
  `total_cents()` = discounted subtotal + tax.
"""
rubric = [
  "SAVE10 gives 10% off the subtotal, rounded down to whole cents.",
  "FLAT500 gives 500 cents off.",
  "The discount can never make the subtotal negative.",
  "Applying a new code replaces the previously active code.",
  "Codes are matched case-insensitively.",
  "Unknown codes raise an error named InvalidDiscountCode.",
  "Tax is computed on the discounted subtotal and total = discounted subtotal + tax.",
]
